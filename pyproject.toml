[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gas-turbine-ambient-effects-regression"
version = "1.0.0"
description = "Machine Learning Benchmark for Gas Turbine Power Derating Under Ambient Thermodynamic Effects"
readme = "README.md"
authors = [{ name = "Mohammed Basra", email = "mohammedbasra.star@gmail.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "joblib>=1.3.0",
    "openpyxl>=3.1.0",
]

[project.urls]
"Homepage" = "https://github.com/mohammedbasra-star/gas-turbine-ambient-effects-regression"
"Repository" = "https://github.com/mohammedbasra-star/gas-turbine-ambient-effects-regression.git"
